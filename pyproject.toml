[project]
name = "hearing-the-heat"
version = "1.2.0"
description = "Analysis code for 'Hearing the heat': nonlinear sound measures and the heating-cooling cycle of decomposing organic matter"
authors = [{ name = "Jakob Eisenhauer" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.5",
    "matplotlib==3.11.2",
    "numba==0.67.0",
    "soundfile==0.14.0",
]

[tool.uv]
package = false
